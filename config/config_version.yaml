# Change version if you changed any grid parameters or queries (e.g. transformer query)
VERSION_ID: "1.0"

# state here which parameters, queries are used to compute the grids with current VERSION_ID
VERSION_COMMENT: base version

# Average apartment area in square meters
AVG_APARTMENT_AREA: 75

# Peak load per m2 for commercial, public and industrial is in kW/m2
# Peak load per household for SFH, MFH, TH and AB is in kW/household
CONSUMER_CATEGORIES:
  - {consumer_category_id: 1, definition: Commercial, peak_load: null, yearly_consumption: null, peak_load_per_m2: 0.2, yearly_consumption_per_m2: 2.457, sim_factor: 0.50}
  - {consumer_category_id: 2, definition: Public, peak_load: null, yearly_consumption: null, peak_load_per_m2: 0.15, yearly_consumption_per_m2: 1.557, sim_factor: 0.60}
  - {consumer_category_id: 9, definition: SFH, peak_load: 30.00, yearly_consumption: 0.00, peak_load_per_m2: null, yearly_consumption_per_m2: null, sim_factor: 0.07}
  - {consumer_category_id: 10, definition: MFH, peak_load: 30.00, yearly_consumption: 0.00, peak_load_per_m2: null, yearly_consumption_per_m2: null, sim_factor: 0.07}
  - {consumer_category_id: 11, definition: TH, peak_load: 30.00, yearly_consumption: 0.00, peak_load_per_m2: null, yearly_consumption_per_m2: null, sim_factor: 0.07}
  - {consumer_category_id: 12, definition: AB, peak_load: 30.00, yearly_consumption: 0.00, peak_load_per_m2: null, yearly_consumption_per_m2: null, sim_factor: 0.07}

# Larger components are divided by k-means clustering in roughly LARGE_COMPONENT_DIVIDER sizes
LARGE_COMPONENT_LOWER_BOUND: 2000
LARGE_COMPONENT_DIVIDER: 1000

# Peak load thresholds for grid level connection
LV_THRESHOLD_KW: 200
MV_THRESHOLD_KW: 1000

# Load density thresholds for settlement type classification (MVA/km²)
POWER_FACTOR: 0.9 # 90% of the peak load is used for the load density calculation
RURAL_LD: 150     # Rural areas: < X MVA/km²
URBAN_LD: 300     # Urban areas: > X MVA/km²

# Voltage properties

VN: 400  # V

V_BAND_LOW: 0.95  # +-5%
V_BAND_HIGH: 1.05

# Voltage-level specific bases and drop limits
BASE_VOLTAGE_V:
  MV: 12470   # 12.47 kV for MV
  LV: 416     # 416 V for LV secondary

VOLTAGE_DROP_LIMIT_PCT:
  MV: 2.5     # Typical stricter MV feeder limit
  LV: 4.5     # Typical LV feeder limit
